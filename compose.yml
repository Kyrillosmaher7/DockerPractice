services:

  app:

    build:
      context: .

    container_name: flask-app

    restart: unless-stopped


    environment:

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      POSTGRES_DB: visitors_db

      POSTGRES_USER: admin

      POSTGRES_PASSWORD: password123


    depends_on:

      - postgres


    networks:

      - backend



  nginx:


    image: nginx:latest


    container_name: nginx-server


    restart: unless-stopped


    ports:

      - "8080:80"



    volumes:

      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro



    depends_on:

      - app



    networks:

      - backend



  postgres:


    image: postgres:17


    container_name: postgres-db


    restart: unless-stopped



    environment:

      POSTGRES_DB: visitors_db

      POSTGRES_USER: admin

      POSTGRES_PASSWORD: password123



    volumes:

      - postgres_data:/var/lib/postgresql/data



    networks:

      - backend



networks:


  backend:


    driver: bridge



volumes:


  postgres_data: